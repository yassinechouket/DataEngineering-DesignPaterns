# Airflow 3.3.1 — local development
# Airflow + its metadata PostgreSQL run in Docker.
# AWS services (S3, Lambda, SQS, Bedrock, OpenSearch, etc.) are REAL AWS services.

x-airflow-common:
  &airflow-common

  build:
    context: .
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.1}

  image: airflow-rag:3.3.1

  environment:
    &airflow-common-env


    # Airflow


    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}

    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"


    # PostgreSQL connection used for ingestion_manifest.
    AIRFLOW_CONN_MANIFEST_DB: "postgresql://airflow:airflow@postgres:5432/airflow"

    # PostgreSQL connection used for RAG data.
    # Keep this only if rag_data is intentionally local.
    AIRFLOW_CONN_RAG_DATA: "postgresql://airflow:airflow@postgres:5432/rag_data"

    # Make /opt/airflow/include importable.
    #
    # This allows:
    #
    # from rag import ...
    #
    PYTHONPATH: "/opt/airflow/include"



    # AWS


    S3_BUCKET: ${S3_BUCKET}

    AWS_REGION: ${AWS_REGION:-us-east-1}

    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

    # Optional: only needed if you're not mounting ~/.aws below (e.g. CI,
    # or temporary SSO/STS credentials). Leave unset to use the mounted
    # credentials file / profile instead.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}

    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

    AWS_PROFILE: ${AWS_PROFILE:-}


    # Embeddings
    

    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}

    VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}


  volumes:

    # DAGs
    - ${AIRFLOW_PROJ_DIR:-.}/dag:/opt/airflow/dags

    # Reusable RAG Python package
    - ${AIRFLOW_PROJ_DIR:-.}/include:/opt/airflow/include

    # Airflow logs
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs

    # Airflow config
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config

    # Airflow plugins
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins

    # Local AWS credentials/config (read-only), so boto3's default
    # credential chain resolves inside the container. Alternative to the
    # AWS_ACCESS_KEY_ID/SECRET/SESSION_TOKEN env vars above.
    - ${HOME}/.aws:/home/airflow/.aws:ro


  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on

    postgres:
      condition: service_healthy


services:

  
  # PostgreSQL
  
  #
  # Used locally by Airflow.
  #
  # Database:
  #   airflow  -> Airflow metadata
  #
  # Database:
  #   rag_data -> RAG data, if your project keeps this locally.
 

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "airflow"
        ]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always



  # Airflow API Server


  airflow-apiserver:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  
  # Airflow Scheduler


  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


 
  # Airflow DAG Processor


  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully



  # Airflow Triggerer


  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully



  # Airflow Initialization


  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config,include}

        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/

        /entrypoint airflow version

    environment:
      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: "true"

      _AIRFLOW_WWW_USER_CREATE: "true"

      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}

      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

    user: "0:0"



  # Airflow CLI

  airflow-cli:
    <<: *airflow-common

    profiles:
      - debug

    environment:
      <<: *airflow-common-env

      CONNECTION_CHECK_MAX_COUNT: "0"

    command:
      - bash
      - -c
      - airflow

    depends_on:
      <<: *airflow-common-depends-on



volumes:

  postgres-db-volume: